<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin users · SavitriBridge</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a class="skip-link" href="#main">Skip to content</a>
<div class="app"><aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
<div class="main"><header class="topbar" id="topbar"></header><main class="content" id="main" tabindex="-1">
<div class="page-head"><div><h2>Admin users</h2><p>Only Super Admins can create or manage administrators. Role changes and deactivation sign the person out immediately.</p></div><div class="actions"><button class="btn btn-primary" id="new-btn">New admin</button></div></div><div id="list"></div><dialog id="admin-dlg"><div class="dlg-head"><h3>New admin</h3></div><div class="dlg-body"><form id="admin-form" class="form-grid" id="af"><div class="field full"><label for="a-name">Name</label><input id="a-name" name="name" required></div><div class="field full"><label for="a-email">Email</label><input id="a-email" name="email" type="email" required></div>
<div class="field"><label for="a-role">Role</label><select id="a-role" name="role"><option>VIEWER</option><option>MARKETER</option><option>ADMIN</option><option>SUPER_ADMIN</option></select></div><div class="field"><label for="a-pw">Initial password</label><input id="a-pw" name="password" type="password" autocomplete="new-password" required minlength="10"><span class="help">10+ chars with upper, lower and a number.</span></div>
<div class="notice err full" id="admin-err" role="alert" hidden></div><div class="full actions" style="justify-content:flex-end"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Create admin</button></div></form></div><div class="dlg-foot"></div></dialog><dialog id="role-dlg"><div class="dlg-head"><h3>Change role</h3></div><div class="dlg-body"><div class="field"><label for="role-select">Role</label><select id="role-select"><option>VIEWER</option><option>MARKETER</option><option>ADMIN</option><option>SUPER_ADMIN</option></select><span class="help" id="role-help"></span></div></div><div class="dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="role-save">Save role</button></div></dialog><dialog id="pw-dlg"><div class="dlg-head"><h3>Reset password</h3></div><div class="dlg-body"><form id="pw-form"><div class="field"><label for="np">New password</label><input id="np" name="newPassword" type="password" autocomplete="new-password" required minlength="10"></div><div class="notice err" id="pw-err" role="alert" hidden style="margin-top:10px"></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Reset password</button></div></form></div><div class="dlg-foot"></div></dialog>
</main></div></div><script type="module">import './js/admins.js';</script></body></html>
