<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Template · SavitriBridge</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a class="skip-link" href="#main">Skip to content</a>
<div class="app"><aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
<div class="main"><header class="topbar" id="topbar"></header><main class="content" id="main" tabindex="-1">
<div class="page-head"><div><h2 id="page-h">New template</h2></div></div><div class="notice err" id="form-error" role="alert" hidden></div>
<form id="template-form" class="split" novalidate><div class="card"><div class="form-grid">
<div class="field full"><label for="templateName">Template name</label><input id="templateName" name="templateName" required maxlength="120"></div>
<div class="field full"><label for="projectId">Scope</label><select id="projectId" name="projectId"></select><span class="help">Global templates can be used with any project.</span></div>
<div class="field"><label for="type">Type</label><select id="type" name="type"><option value="MARKETING">Marketing</option><option value="TRANSACTIONAL">Transactional</option></select></div>
<div class="field full"><label for="title">Title</label><input id="title" name="title" required maxlength="100"><div class="counter" data-counter="title"></div></div>
<div class="field full"><label for="body">Message</label><textarea id="body" name="body" required maxlength="300"></textarea><div class="counter" data-counter="body"></div></div>
<div class="field full"><label for="targetUrl">Target URL</label><input id="targetUrl" name="targetUrl" type="url"  placeholder="https://your-site.example/offers"><span class="help">Must be on one of the project's allowed origins. javascript:, data: and other schemes are rejected.</span></div>
<div class="field full"><label for="iconUrl">Icon</label><div class="media-row"><input id="iconUrl" name="iconUrl" type="url" placeholder="https://… (HTTPS image URL)"><button class="btn" type="button" data-upload="iconUrl">Upload</button></div></div>
<div class="field full"><label for="badgeUrl">Badge <span class="muted">(small monochrome icon, Android)</span></label><div class="media-row"><input id="badgeUrl" name="badgeUrl" type="url"><button class="btn" type="button" data-upload="badgeUrl">Upload</button></div></div>
<div class="field full"><label for="imageUrl">Large image <span class="muted">(where supported)</span></label><div class="media-row"><input id="imageUrl" name="imageUrl" type="url"><button class="btn" type="button" data-upload="imageUrl">Upload</button></div></div>
<div class="field"><label for="notificationTag">Notification tag</label><input id="notificationTag" name="notificationTag" maxlength="60"><span class="help">Same tag replaces an earlier notification.</span></div>
<div class="field"><span class="lbl">Options</span><label class="check"><input type="checkbox" name="requireInteraction"> Require interaction (where supported)</label></div>
<div class="field"><span class="lbl">Status</span><label class="check"><input type="checkbox" name="active" checked> Enabled</label></div></div>
<div class="actions" style="margin-top:18px"><a class="btn" href="templates.html">Cancel</a><button class="btn btn-primary" type="submit">Save template</button></div></div>
<aside class="card"><h3>Preview</h3><div id="preview"></div></aside></form>
</main></div></div><script type="module">import { initCreate } from './js/templates.js'; initCreate();</script></body></html>
