<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Settings · SavitriBridge</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a class="skip-link" href="#main">Skip to content</a>
<div class="app"><aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
<div class="main"><header class="topbar" id="topbar"></header><main class="content" id="main" tabindex="-1">
<div class="page-head"><div><h2>Settings</h2></div></div><div class="grid cols-2">
<div class="card"><h3>Change your password</h3><form id="pw-form" class="stack"><div class="field"><label for="cp">Current password</label><input id="cp" name="currentPassword" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="n1">New password</label><input id="n1" name="newPassword" type="password" autocomplete="new-password" required minlength="10"></div><div class="field"><label for="n2">Confirm new password</label><input id="n2" name="confirm" type="password" autocomplete="new-password" required></div>
<div class="notice err" id="pw-err" role="alert" hidden></div><button class="btn btn-primary" type="submit">Change password</button></form></div>
<div class="card" id="sys-card"><h3>System</h3><div id="sys"><div class="loading">Loading…</div></div></div><div class="card"><h3>Rate limits</h3><div id="rates"></div></div>
<div class="card"><h3>Attribution</h3><p class="small">Reverse-geocoded addresses use OpenStreetMap Nominatim. Address data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, ODbL.</p></div></div>
</main></div></div><script type="module">import './js/settings.js';</script></body></html>
